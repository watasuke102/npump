[package]
name = "npump"
description = "npm update checker with TUI"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
glob = "0.3"
once_cell = "1.21"
percent-encoding = "2.3"
ratatui = "0.29"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0"
serde_json = "1.0"
